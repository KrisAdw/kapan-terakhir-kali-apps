name: ktk
description: "KTK: Kapan Terakhir Kali...? — offline-first personal history & activity tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3

  cupertino_icons: ^1.0.8
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  uuid: ^4.6.0
  path: ^1.9.1
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-400.ttf
          weight: 400
        - asset: assets/fonts/Caveat-500.ttf
          weight: 500
        - asset: assets/fonts/Caveat-600.ttf
          weight: 600
        - asset: assets/fonts/Caveat-700.ttf
          weight: 700
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-400.ttf
          weight: 400
        - asset: assets/fonts/DMSans-500.ttf
          weight: 500
        - asset: assets/fonts/DMSans-600.ttf
          weight: 600
        - asset: assets/fonts/DMSans-700.ttf
          weight: 700
